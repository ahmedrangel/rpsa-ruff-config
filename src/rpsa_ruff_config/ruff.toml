# RPSA Ruff configuration preset.
# https://github.com/ahmedrangel/rpsa-ruff-config

line-length = 100
indent-width = 2
target-version = "py310"

[lint]
select = [
  "E",   # pycodestyle errors (includes E70x: statements/semicolons)
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PIE", # flake8-pie
  "Q",   # flake8-quotes (double quotes)
  "RUF", # ruff-specific rules
  "E303" # too many blank lines (preview rule)
]
# E303 is in preview. With explicit-preview-rules only the preview rules listed in
# `select` are enabled, not every preview rule.
preview = true
explicit-preview-rules = true

[lint.per-file-ignores]
"__init__.py" = ["F401"] # re-exports
"tests/**/*.py" = ["B018", "N802"]

[lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true
docstring-code-format = true
