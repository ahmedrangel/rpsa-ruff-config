# RPSA Ruff configuration preset.
# https://github.com/ahmedrangel/rpsa-ruff-config

line-length = 100
indent-width = 2
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[lint]
select = [
  "E",   # pycodestyle errors (includes E70x: statements/semicolons)
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PIE", # flake8-pie
  "RUF"  # ruff-specific rules
]

[lint.per-file-ignores]
"__init__.py" = ["F401"] # re-exports
"tests/**/*.py" = ["B018", "N802"]

[lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true
docstring-code-format = true
